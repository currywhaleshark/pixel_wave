<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>픽셀 파도: 집으로 가는 길</title>
<style>
  /* 픽셀 폰트 — 파일이 없으면 자동으로 sans-serif 폴백 (js/fonts.js가 감지)
     후보·라이선스는 docs/ART_SPEC.md 7장 참고 */
  @font-face {
    font-family: 'Galmuri9';
    src: url('assets/fonts/Galmuri9.woff2') format('woff2');
    font-weight: normal;
    font-display: block;
  }
  @font-face {
    font-family: 'Galmuri11';
    src: url('assets/fonts/Galmuri11.woff2') format('woff2');
    font-weight: normal;
    font-display: block;
  }
  /* 진짜 볼드 — 합성 볼드는 픽셀 획을 뭉갠다 */
  @font-face {
    font-family: 'Galmuri11';
    src: url('assets/fonts/Galmuri11-Bold.woff2') format('woff2');
    font-weight: bold;
    font-display: block;
  }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #071b3f;
    overflow: hidden;
    touch-action: none;
    -webkit-user-select: none; user-select: none;
  }
  #wrap {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
  }
  canvas {
    background: #0b2a6b;
    /* 픽셀 보존: 확대는 nearest로 */
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    touch-action: none;
    cursor: crosshair;
    /* 실제 표시 크기는 js/main.js의 fitCanvas()가 정수 배율로 지정한다 */
  }
</style>
</head>
<body>
<div id="wrap"><canvas id="game" width="960" height="540"></canvas></div>
<!-- ?v= : 브라우저 휴리스틱 캐시 무효화용. 배포 시 버전 올리기 -->
<script src="js/config.js?v=1"></script>
<script src="js/fonts.js?v=1"></script>
<script src="js/audio.js?v=1"></script>
<script src="js/input.js?v=1"></script>
<script src="js/assets.js?v=21"></script>
<script src="js/spriteRenderer.js?v=3"></script>
<script src="js/backgroundRenderer.js?v=10"></script>
<script src="js/meta.js?v=1"></script>
<script src="js/entities.js?v=2"></script>
<script src="js/dolphin.js?v=1"></script>
<script src="js/waves.js?v=1"></script>
<script src="js/barragePatterns.generated.js?v=2"></script>
<script src="js/barrage.js?v=1"></script>
<script src="js/boss.js?v=1"></script>
<script src="js/boss2.js?v=2"></script>
<script src="js/boss3.js?v=2"></script>
<script src="js/boss4.js?v=3"></script>
<script src="js/boss5.js?v=4"></script>
<script src="js/boss6.js?v=1"></script>
<script src="js/boss7.js?v=1"></script>
<script src="js/map.js?v=1"></script>
<script src="js/main.js?v=6"></script>
</body>
</html>
